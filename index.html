<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية عيد ميلاد 💎</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background: radial-gradient(circle at top,#1e1e2f,#0f0f1a 70%);
color:white;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.stars{
position:absolute;
width:100%;
height:100%;
background:transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
animation: moveStars 60s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

.container{
position:relative;
z-index:2;
width:95%;
max-width:650px;
opacity:0;
transform:translateY(40px);
transition:1s ease;
}

.show{
opacity:1;
transform:translateY(0);
}

.hidden{display:none;}

h1{
font-size:34px;
margin-bottom:20px;
background:linear-gradient(45deg,#ffd700,#ff7eb3);
-webkit-background-clip:text;
color:transparent;
}

.profile-img{
width:200px;
height:200px;
border-radius:50%;
object-fit:cover;
border:5px solid #ffd700;
box-shadow:0 0 30px rgba(255,215,0,0.6);
margin-bottom:20px;
transition:0.6s;
}

.profile-img:hover{
transform:scale(1.08) rotate(3deg);
}

#countdown{
font-size:28px;
margin:15px 0;
}

.hint{
opacity:0.8;
font-size:14px;
}

.gift-btn{
margin-top:25px;
padding:14px 30px;
border:none;
border-radius:30px;
cursor:pointer;
background:linear-gradient(45deg,#ffd700,#ff7eb3);
color:black;
font-weight:bold;
font-size:18px;
transition:0.4s;
box-shadow:0 0 20px rgba(255,215,0,0.6);
animation:pulse 1.5s infinite;
}

.gift-btn:hover{
transform:scale(1.1);
}

@keyframes pulse{
0%{box-shadow:0 0 10px rgba(255,215,0,0.4);}
50%{box-shadow:0 0 25px rgba(255,215,0,0.9);}
100%{box-shadow:0 0 10px rgba(255,215,0,0.4);}
}

.options{
display:flex;
gap:20px;
margin-top:20px;
justify-content:center;
flex-wrap:wrap;
}

.option{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:15px 25px;
border-radius:15px;
cursor:pointer;
transition:0.4s;
border:1px solid rgba(255,255,255,0.2);
}

.option:hover{
transform:translateY(-5px) scale(1.05);
background:#ffd700;
color:#000;
}

.selected{
background:#ffd700 !important;
color:#000 !important;
}

button{
margin-top:25px;
padding:12px 25px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(45deg,#ffd700,#ff7eb3);
color:black;
font-weight:bold;
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

.final-message{
font-size:22px;
line-height:2;
min-height:120px;
}

.confetti{
position:absolute;
width:8px;
height:14px;
top:-20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

.music-btn{
position:fixed;
top:15px;
left:15px;
background:#ffd700;
color:black;
padding:8px 15px;
border-radius:20px;
cursor:pointer;
z-index:5;
font-size:14px;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="music-btn" onclick="toggleMusic()">🎵 كتم</div>

<audio id="bgMusic" autoplay loop>
<source src="wNut8QshEx0.mp3" type="audio/mpeg">
</audio>

<!-- الصفحة الأولى -->
<div class="container show" id="home">
<h1>كل عام وأنت بألف خير يا أغلى شخص بحياتي 💎🎉</h1>
<img src="IMG-20251130-WA0020.jpg" class="profile-img">
<div id="countdown"></div>
<div class="hint">انتظر المفاجأة بعد انتهاء العد التنازلي 😉🎁</div>
<button id="giftButton" class="gift-btn hidden" onclick="goToQuestions()">🎁 خد هديتك</button>
</div>

<!-- الأسئلة -->
<div class="container hidden" id="questions">
<h2>شو برأيك أفضل؟</h2>
<div class="options" id="q1">
<div class="option">وجبات الشاورما 🌯</div>
<div class="option">وجبات المشاوي 🍢</div>
</div>

<h2 style="margin-top:30px;">مين أفضل محل حلو بالمنطقة؟</h2>
<div class="options" id="q2">
<div class="option">ذهب 🍰</div>
<div class="option">الأمراء 🧁</div>
</div>

<button onclick="showFinal()">اكشف المفاجأة 💎</button>
</div>

<!-- الصفحة النهائية -->
<div class="container hidden" id="final">
<div class="final-message" id="typedText"></div>
<button onclick="location.reload()">إعادة المفاجأة 🔄</button>
</div>

<script>

const birthday = new Date("2026-02-23T00:00:00").getTime();

const countdownEl = document.getElementById("countdown");
const giftButton = document.getElementById("giftButton");

const timer = setInterval(()=>{
const now = new Date().getTime();
const distance = birthday - now;

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

countdownEl.innerHTML = `${days} يوم ${hours} ساعة ${minutes} دقيقة ${seconds} ثانية`;

if(distance < 0){
clearInterval(timer);
countdownEl.innerHTML = "🎉 اليوم هو عيد ميلادك 🎉";
giftButton.classList.remove("hidden");
}
},1000);

function goToQuestions(){
document.getElementById("home").classList.add("hidden");
document.getElementById("questions").classList.remove("hidden");
document.getElementById("questions").classList.add("show");
}

let answer1="", answer2="";

document.querySelectorAll("#q1 .option").forEach(opt=>{
opt.onclick=function(){
document.querySelectorAll("#q1 .option").forEach(o=>o.classList.remove("selected"));
this.classList.add("selected");
answer1=this.innerText;
}
});

document.querySelectorAll("#q2 .option").forEach(opt=>{
opt.onclick=function(){
document.querySelectorAll("#q2 .option").forEach(o=>o.classList.remove("selected"));
this.classList.add("selected");
answer2=this.innerText;
}
});

function showFinal(){
if(!answer1 || !answer2){
alert("اختار من السؤالين 😉");
return;
}

document.getElementById("questions").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");
document.getElementById("final").classList.add("show");

startConfetti();
typeMessage();
}

function typeMessage(){
const text = `كل عام وأنت صديقي وأخوي وسندي ❤️

بكرة رح نفطر سوا  ${answer1} 😍
ونتحلى سوا من ${answer2} 🎂

ونحتفل سوا ب احلى يوم من ايام السنة   ✨🎉`;

let i=0;
const typed=document.getElementById("typedText");
typed.innerHTML="";

function typing(){
if(i<text.length){
typed.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,40);
}
}
typing();
}

function startConfetti(){
for(let i=0;i<80;i++){
let conf=document.createElement("div");
conf.classList.add("confetti");
conf.style.left=Math.random()*100+"vw";
conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
conf.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(conf);
}
}

const music=document.getElementById("bgMusic");
function toggleMusic(){
if(music.paused){
music.play();
document.querySelector(".music-btn").innerText="🎵 كتم";
}else{
music.pause();
document.querySelector(".music-btn").innerText="🎵 تشغيل";
}
}
</script>

</body>
</html>
